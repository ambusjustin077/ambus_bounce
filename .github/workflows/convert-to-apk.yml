name: Convert Web App to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build WebAPK
      run: |
        bubblewrap init --manifest="https://github.io" --meta=none --yes
        bubblewrap build --skipSigning --yes
