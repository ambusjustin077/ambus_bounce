name: Convert Web App to APK (Fail-Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    # Generates a clean local configuration profile to bypass web fetching errors
    - name: Generate Local TWA Config
      run: |
        echo '{
          "packageId": "com.ambusjustin077.ambus_bounce",
          "host": "ambusjustin077.github.io",
          "name": "Ambus Bounce",
          "shortName": "Bounce",
          "themeColor": "#000000",
          "backgroundColor": "#000000",
          "startUrl": "/ambus_bounce/",
          "iconUrl": "https://github.io",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": false,
          "signingKey": {
            "path": "./android.keystore",
            "alias": "android"
          },
          "generatorApp": "bubblewrap"
        }' > twa-manifest.json

    - name: Build Android App (APK)
      run: |
        bubblewrap build --skipSigning --yes

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: web-app-apk
        path: ./**/*.apk
