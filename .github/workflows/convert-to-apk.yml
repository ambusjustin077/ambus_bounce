name: Convert Web App to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build WebAPK
      run: |
        bubblewrap init --manifest="https://github.io" --meta=none --yes
        bubblewrap build --skipSigning

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: web-app-apk
        path: ./*.apk
